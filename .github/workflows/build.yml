# 윈도우 exe 빌드 · 릴리스
#
# **윈도우에서 짓는다.** 리눅스에서도 지을 수는 있지만 exe의 아이콘·이름 같은
# 메타데이터를 넣는 단계에 wine이 필요해서, 건너뛰면 exe 속성이 "Electron"으로 남는다.
# 여기서는 windows-latest로 지어 그 문제가 아예 없다.
#
# 릴리스로 올리려면 Actions에서 손으로 돌리면서 `tag` 를 채운다. 비워 두면 짓기만 하고
# artifact로 남는다. 태그(v*)를 밀어도 릴리스가 된다 — 다만 이 저장소를 다루는 자동화
# 세션은 브랜치에만 밀 수 있어서(태그 푸시가 403) 손으로 돌리는 쪽을 주로 쓴다.
# 태그가 없으면 `gh release create` 가 지금 커밋에 태그를 만들어 붙인다.
name: 윈도우 빌드

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '릴리스 태그 (비우면 빌드만 하고 릴리스는 안 만든다)'
        required: false
        default: ''
  push:
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # 앱이 진짜로 뜨는지 보는 테스트는 화면이 필요하다 (test/smoke.test.js)
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npm run check
      # ★ **건너뛴 테스트가 있으면 실패로 친다.**
      #
      # 여기 테스트들은 조건이 안 맞으면 스스로 건너뛴다 — 화면이 없으면 부팅 테스트가,
      # 표본 파일이 없으면 인식기 테스트가. 그건 사람이 직접 돌릴 때는 옳지만, CI에서는
      # **초록불인데 아무것도 안 본 상태**가 된다. 검사를 못 했으면 못 했다고 해야 한다.
      - name: 건너뛴 테스트가 없는지
        run: |
          set -e
          npm test 2>&1 | tee out.txt
          n=$(grep -oP '^# skipped \K\d+' out.txt || echo 0)
          echo "건너뜀 $n개"
          if [ "$n" != "0" ]; then
            echo "::error::테스트 $n개가 건너뛰어졌다 — CI에서는 전부 돌아야 한다"
            grep -E '# SKIP' out.txt || true
            exit 1
          fi

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: skre-overlay-windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: skre-overlay-windows
          path: dist
      - name: 릴리스 올리기
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # 태그를 밀어서 돈 것이면 그 태그, 손으로 돌린 것이면 입력한 태그
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
          # 손으로 돌릴 때는 태그가 아직 없다 — gh 가 이 커밋에 만들어 붙이게 한다
          TARGET: ${{ github.sha }}
        run: |
          set -e
          ls -la dist/
          cat > notes.md <<'NOTES'
          실제 게임에서 검증하기 전의 **시험판**입니다. 잘 되는지보다 **어디서 어긋나는지**를
          알고 싶은 것이니, 이상한 게 보이면 **[⚙] → [전투 기록 저장]** 을 눌러 주세요.

          ## 쓰는 법

          1. exe를 아무 폴더에나 두고 실행합니다. **설치 과정이 없습니다** — 더블클릭하면 바로 창이 뜹니다.
          2. 길드봇이 만드는 `data/builds.json` 을 앱이 알아서 찾습니다. 못 찾으면 **[⚙] → [도감 파일 선택]**.
          3. 게임을 **테두리 없는 창모드**로 켜고, 빌드를 고른 뒤 **[자동]** 을 켭니다.

          턴 영역은 **이미 파괴신 자리로 맞춰져 있습니다** (왼쪽 위 `턴 16 / 70`).
          안 맞으면 [턴 영역]으로 잡거나 [기본 위치]로 되돌립니다.

          > 윈도우가 "알 수 없는 게시자"로 막을 수 있습니다 (코드 서명이 없어서).
          > `추가 정보 → 실행` 으로 넘어가면 됩니다.

          ## 이번 판에 들어간 것

          - **턴이 `16 / 70` 이라는 걸 반영했습니다.** 슬래시를 찾아 왼쪽 숫자만 읽습니다.
            "N / M" 표본 1008장에서 맞음 96.8% · **오독 0%** · 모르겠음 3.2%.
          - **파괴신 턴 영역 기본값** — 드래그 없이 바로 씁니다.
          - **전투 기록** — 자동이 도는 동안 최근 10분을 늘 담고 있다가, 누르면 바탕화면에
            JSON 한 장으로 나옵니다. 그 파일로 프레임 단위 재생과 인식기 재측정을 합니다.
          - 연출로 가려짐 · 턴 밀림 · 재시작 · 리셋 라운드를 견디는 추적기 (전투 시나리오 82개).

          ## 확인된 것 / 안 된 것

          테스트 185개 통과 (인식기 · 추적기 · 파서 · 앱 부팅). 다만 **실제 게임에서는
          아직 한 번도 안 돌려 봤습니다.** 게임 폰트·고DPI·실제 연출은 이 판으로 처음 확인합니다.
          NOTES
          gh release create "$TAG" dist/*.exe \
            --repo "$REPO" \
            --target "$TARGET" \
            --title "SKRE 오버레이 $TAG — 시험판" \
            --notes-file notes.md \
            --prerelease
          gh release view "$TAG" --repo "$REPO" --json url --jq .url
